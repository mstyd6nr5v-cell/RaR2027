<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rock am Ring 2027 Countdown</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:'Inter',sans-serif;

height:100vh;

overflow:hidden;

background:#080808;

color:white;

display:flex;

justify-content:center;

align-items:center;

}

/* Hintergrund */

.background{

position:absolute;

inset:0;

background:

radial-gradient(circle at 20% 20%,#ff0033 0%,transparent 30%),

radial-gradient(circle at 80% 30%,#7a00ff 0%,transparent 25%),

radial-gradient(circle at 50% 90%,#ff7700 0%,transparent 35%),

#050505;

animation:bg 10s ease-in-out infinite alternate;

filter:blur(20px);

}

@keyframes bg{

0%{

transform:scale(1);

}

100%{

transform:scale(1.15);

}

}

.card{

position:relative;

z-index:5;

width:min(900px,90%);

padding:60px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

border-radius:30px;

box-shadow:0 20px 80px rgba(0,0,0,.5);

text-align:center;

}

.logo{

font-size:5rem;

margin-bottom:20px;

}

h1{

font-size:clamp(2.2rem,5vw,4.5rem);

font-weight:900;

margin-bottom:10px;

}

.subtitle{

color:#cccccc;

font-size:1.2rem;

margin-bottom:50px;

}

.countdown{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

}

.time{

background:rgba(255,255,255,.05);

padding:30px;

border-radius:20px;

transition:.3s;

}

.time:hover{

transform:translateY(-8px);

background:rgba(255,255,255,.1);

}

.value{

font-size:clamp(2rem,5vw,4rem);

font-weight:900;

background:linear-gradient(90deg,#ff003c,#ff7a00);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.label{

margin-top:10px;

letter-spacing:2px;

text-transform:uppercase;

color:#aaa;

font-size:.9rem;

}

.footer{

margin-top:45px;

color:#999;

font-size:1rem;

}

.progress{

margin-top:40px;

height:8px;

background:#222;

border-radius:20px;

overflow:hidden;

}

.progress span{

display:block;

height:100%;

width:0%;

background:linear-gradient(90deg,#ff0033,#ff8800);

transition:.5s;

}

@media(max-width:700px){

.countdown{

grid-template-columns:repeat(2,1fr);

}

.card{

padding:35px;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="card">

<div class="logo">🤘</div>

<h1>Rock am Ring 2027</h1>

<div class="subtitle">

Nürburgring • 04.–06. Juni 2027

</div>

<div class="countdown">

<div class="time">

<div id="days" class="value">0</div>

<div class="label">Tage</div>

</div>

<div class="time">

<div id="hours" class="value">0</div>

<div class="label">Stunden</div>

</div>

<div class="time">

<div id="minutes" class="value">0</div>

<div class="label">Minuten</div>

</div>

<div class="time">

<div id="seconds" class="value">0</div>

<div class="label">Sekunden</div>

</div>

</div>

<div class="progress">

<span id="progress"></span>

</div>

<div class="footer">

🎸 Die Vorfreude läuft...

</div>

</div>

<script>

const start=new Date("2026-08-05T00:00:00").getTime();

const target=new Date("2027-06-04T12:00:00").getTime();

function update(){

const now=Date.now();

const diff=target-now;

if(diff<=0){

document.body.innerHTML="<h1 style='color:white;font-family:Inter'>🤘 Rock am Ring 2027 läuft!</h1>";

return;

}

const d=Math.floor(diff/1000/60/60/24);

const h=Math.floor(diff/(1000*60*60)%24);

const m=Math.floor(diff/(1000*60)%60);

const s=Math.floor(diff/1000%60);

days.textContent=d;

hours.textContent=h;

minutes.textContent=m;

seconds.textContent=s;

const total=target-start;

const done=now-start;

let percent=Math.min(done/total*100,100);

progress.style.width=percent+"%";

}

update();

setInterval(update,1000);

</script>

</body>

</html>
